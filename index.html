<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Jogo da Memória dos Emojis</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Nome do Autor -->
    <p class="autor">Criado por: Seu Nome Aqui</p>

    <!-- Título Principal -->
    <h1>Jogo da Memória 🧠</h1>

    <!-- Texto Explicativo -->
    <p class="descricao">Clique nas cartas para virá-las e encontre todos os pares de emojis iguais!</p>

    <!-- Painel de Informações -->
    <div class="painel">
        <p>Tentativas: <span id="tentativas">0</span></p>
        <button id="btn-reiniciar" onclick="reiniciarJogo()">Reiniciar Jogo</button>
    </div>

    <!-- Tabuleiro das Cartas -->
    <div class="tabuleiro" id="tabuleiro">
        <!-- As cartas serão criadas dinamicamente via JavaScript -->
    </div>

    <script src="script.js"></script>
</body>
</html>
