<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elevador Surreal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Autor -->
    <p class="autor">Desenvolvido por: [SEU NOME AQUI]</p>

    <!-- Título -->
    <h1>Elevador Surreal 👁️✨</h1>

    <!-- Descrição -->
    <p class="descricao">
        Escolha o andar correto para navegar pela dimensão dos sonhos. Se escolher o andar proibido, a realidade se distorce!
    </p>

    <!-- Imagem Ilustrativa Surreal -->
    <img src="https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=400" alt="Espaço Surreal" class="imagem-tema">

    <!-- Container do Jogo -->
    <form class="painel-elevador">
        
        <!-- Botão de Reiniciar -->
        <button type="reset" class="btn-reiniciar">🔄 Voltar ao Térreo</button>

        <!-- Portas do Elevador -->
        <div class="cenario-container">
            
            <!-- Andar 1 (Espaço Neon) -->
            <input type="radio" name="andar" id="andar1" checked>
            <div class="vista andar-1">
                <span>🌌 Andar 1: Dimensão Espacial</span>
            </div>

            <!-- Andar 2 (Mundo Invertido) -->
            <input type="radio" name="andar" id="andar2">
            <div class="vista andar-2">
                <span>🙃 Andar 2: Gravidade Invertida</span>
            </div>

            <!-- Andar Proibido (Perdeu!) -->
            <input type="radio" name="andar" id="andar-erro">
            <div class="vista andar-alerta">
                <span>⚠️ PERIGO! REALIDADE COLAPSOU! 🌀</span>
            </div>

        </div>

        <!-- Botões do Painel -->
        <div class="botoes-painel">
            <label for="andar1" class="btn-andar">Andar 1</label>
            <label for="andar2" class="btn-andar">Andar 2</label>
            <label for="andar-erro" class="btn-andar btn-perigo">Andar ?</label>
        </div>

    </form>

</body>
</html>
