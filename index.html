<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo do Labirinto Fácil</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Nome do Autor -->
    <p class="autor">Desenvolvido por: [SEU NOME AQUI]</p>

    <!-- Título Principal -->
    <h1>Jogo do Labirinto 🌀</h1>

    <!-- Texto Explicativo -->
    <p class="descricao">
        Passe o mouse pelo caminho escuro! Se encostar na borda azul, você perde e precisa voltar ao INÍCIO para reiniciar.
    </p>

    <!-- Imagem Ilustrativa -->
    <img src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=400" alt="Labirinto" class="imagem-tema">

    <!-- Estrutura do Labirinto -->
    <div class="parede">

        <!-- Mensagem de Erro que cobre o jogo ao bater na borda -->
        <div class="tela-erro">PERDEU! <br> Volte ao INÍCIO 🔄</div>

        <!-- Ponto de Partida -->
        <div class="inicio">INÍCIO</div>

        <!-- Caminho Seguro -->
        <div class="trilho-v"></div>
        <div class="curva">
            <div class="trilho-h"></div>
        </div>
        <div class="trilho-v-final">
            <!-- Ponto Final / Vitória -->
            <div class="chegada">🏆 CHEGADA</div>
        </div>

    </div>

</body>
</html>
