<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo da Memória dos Emojis</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Nome do Autor -->
    <p class="autor">Desenvolvido por: [SEU NOME AQUI]</p>

    <!-- Título Principal -->
    <h1>Jogo da Memória dos Emojis</h1>

    <!-- Texto Explicativo -->
    <p class="descricao">
        Encontre os pares de emojis iguais! Clique em cada carta para revelar o emoji gigante centralizado.
    </p>

    <!-- Imagem Ilustrativa -->
    <img src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=400" alt="Emojis" class="imagem-tema">

    <!-- Container do Jogo (Grade de Cartas Grandes) -->
    <div class="tabuleiro">

        <!-- Par 1: Sorrindo 😀 -->
        <div class="card-box">
            <input type="checkbox" id="c1">
            <label for="c1" class="carta">
                <span class="costas">❓</span>
                <span class="frente">😀</span>
            </label>
        </div>

        <div class="card-box">
            <input type="checkbox" id="c2">
            <label for="c2" class="carta">
                <span class="costas">❓</span>
                <span class="frente">😀</span>
            </label>
        </div>

        <!-- Par 2: Chorando de Rir 😂 -->

            </label>
        </div>

        <div class="card-box">

        <!-- Par 3: Óculos de Sol 🕶️ -->

            <input type="checkbox" id="c5">
            <label for="c5" class="carta">
                <span class="costas">❓</span>
                <span class="frente">😎</span>
            </label>
        </div>

        <div class="card-box">
            <input type="checkbox" id="c6">
            <label for="c6" class="carta">
                <span class="costas">❓</span>
                <span class="frente">😎</span>
            </label>
        </div>

        <!-- Par 4: Anjinho 😇 -->

                <span class="costas">❓</span>

            </label>
        </div>

        <div class="card-box">

            <label for="c8" class="carta">

            </label>
        </div>

    </div>

</body>
</html>
