<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trend do TikTok: Dormiria Aqui?</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Autor -->
    <p class="autor">Desenvolvido por: [SEU NOME AQUI]</p>

    <!-- Título Principal estilo Trend TikTok -->
    <h1>Você dormiria nesse quarto? 🛏️✨</h1>

    <!-- Descrição -->
    <p class="descricao">
        Quarto 1 de 10! Vote abaixo para dizer se você passaria a noite aqui ou se sairia correndo.
    </p>

    <!-- Cartão do Quarto -->
    <form class="card-quarto">
        
        <!-- Número do Quarto -->
        <div class="tag-numero">Quarto 1 / 10</div>

        <!-- Imagem do Quarto -->
        <img src="https://images.unsplash.com/photo-1540518614846-7ede433c5172?w=500" alt="Quarto Aconchegante" class="imagem-quarto">

        <!-- Sistema de Votação (Radio Buttons) -->
        <div class="opcoes-voto">
            <input type="radio" name="voto" id="sim">
            <label for="sim" class="btn-voto btn-sim">😴 Dormiria Com Certeza!</label>

            <input type="radio" name="voto" id="nao">
            <label for="nao" class="btn-voto btn-nao">🚫 Nem A Pau!</label>
        </div>

        <!-- Mensagens de Resposta -->
        <div class="resposta res-sim">Opção registrada: Você DORMIRIA aqui! 🛌✅</div>
        <div class="resposta res-nao">Opção registrada: Você NÃO DORMIRIA aqui! 🏃‍♂️💨</div>

        <!-- Botão para Próximo/Reset -->
        <button type="reset" class="btn-reset">🔄 Mudar de Quarto / Mudar Voto</button>

    </form>

</body>
</html>
